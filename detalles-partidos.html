<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Detalles de Partidos · Acción Fútbol</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e12;--panel:#16161d;--panel2:#1e1e27;--line:#2a2a35;--ink:#f2f2f5;--muted:#9a9aa8;--muted2:#6f6f7d;--pink:#ff2e93;--ok:#27c281;--warn:#ffb020;--blue:#64c8ff;--red:#ff4d5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 90px}
h1{font-family:'Oswald';font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 2px}
h1 em{color:var(--pink);font-style:normal}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
input{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;color:var(--ink);font-family:inherit}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--pink);color:#fff;font-family:'Oswald';font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:16px}
.hidden{display:none!important}
.backhome{display:inline-flex;align-items:center;gap:6px;background:var(--pink);color:#fff;text-decoration:none;font-family:'Oswald';font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:9px 18px;border-radius:10px;margin-bottom:14px;transition:filter .15s}
.backhome:hover{filter:brightness(1.08)}
.logout{position:absolute;top:16px;right:16px;color:var(--muted);font-size:13px;cursor:pointer}
.searchbar{display:flex;gap:0;background:var(--panel2);border:1.5px solid var(--pink);border-radius:14px;overflow:hidden}
.searchbar input{border:none;border-radius:0;background:transparent;font-size:16px;padding:16px}
.searchbar button{border:none;background:var(--pink);color:#fff;font-family:'Oswald';font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:0 26px;cursor:pointer}
.ac-wrap{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel2);border:1px solid var(--line);border-radius:12px;max-height:260px;overflow:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.ac-item{padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:rgba(255,46,147,.1)}
.ac-item .n{font-size:14px;font-weight:600}
.ac-item .m{font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 8px;text-align:center}
.stat .v{font-family:'Oswald';font-weight:700;font-size:26px}
.stat .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.match{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.match .date{font-size:11px;color:var(--muted2);letter-spacing:.08em}
.match .vs{font-family:'Oswald';font-weight:700;font-size:17px;margin:2px 0 1px;text-transform:uppercase}
.match .team{font-size:11px;color:var(--pink);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.match .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 11px;border-radius:999px;white-space:nowrap}
.b-titular{background:rgba(39,194,129,.15);color:#27c281;border:1px solid rgba(39,194,129,.3)}
.b-ingreso{background:rgba(100,200,255,.15);color:#64c8ff;border:1px solid rgba(100,200,255,.3)}
.b-suplente{background:rgba(255,176,32,.15);color:#ffb020;border:1px solid rgba(255,176,32,.3)}
.b-otro{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center}
.mc .v{font-family:'Oswald';font-weight:700;font-size:18px}
.mc .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.tcard{display:flex;gap:10px;justify-content:center;align-items:center}
.tt{display:inline-flex;align-items:center;gap:5px;font-family:'Oswald';font-weight:700;font-size:16px}
.tsq{width:13px;height:17px;border-radius:2px}
.loader{text-align:center;color:var(--muted);padding:24px;font-size:14px}
.savebar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,var(--bg) 30%);padding:16px;z-index:40}
.savebar .inner{max-width:720px;margin:0 auto}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 20px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<a class="backhome" href="/">&#8592; Inicio</a>

<!-- LOGIN -->
<div id="login" class="wrap">
  <div style="height:30px"></div>
  <h1>Detalles de <em>Partidos</em></h1>
  <p class="sub">Acción Fútbol · Portal del Entrenador</p>
  <div class="card">
    <label>Correo</label><input type="email" id="email" autocomplete="username">
    <div style="height:12px"></div>
    <label>Contraseña</label><input type="password" id="pass" autocomplete="current-password">
    <div style="height:14px"></div>
    <button class="btn" id="btn-login">Ingresar</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="wrap hidden">
  <div class="logout" id="btn-logout">Salir</div>
  <h1>Detalles de <em>Partidos</em></h1>
  <p class="sub">Busca los partidos de cualquier jugador por RUT o nombre.</p>

  <div class="ac-wrap">
    <div class="searchbar">
      <input type="text" id="search" placeholder="Nombre o RUT del jugador..." autocomplete="off">
      <button id="btn-buscar">Buscar</button>
    </div>
    <div class="ac-list hidden" id="ac-list"></div>
  </div>
  <div class="err" id="app-err"></div>

  <div id="result"></div>
</div>

<div class="savebar hidden" id="savebar"><div class="inner">
  <button class="btn" id="btn-pdf">Descargar PDF</button>
</div></div>

<div class="toast" id="toast"></div>

let TODOS = [], SEL = null, PARTIDOS = [];

/* Login */
$('btn-login').onclick = async () => {
  const e=$('email').value.trim(), p=$('pass').value;
  $('login-err').textContent='';
  if(!e||!p){ $('login-err').textContent='Ingresa correo y contraseña.'; return; }
  $('btn-login').disabled=true;
  try{ await fbAuth.signInWithEmailAndPassword(e,p); }
  catch(x){ $('login-err').textContent='Correo o contraseña incorrectos.'; }
  $('btn-login').disabled=false;
};
$('btn-logout').onclick=()=>fbAuth.signOut();
$('pass').addEventListener('keydown',e=>{ if(e.key==='Enter') $('btn-login').click(); });

fbAuth.onAuthStateChanged(async u=>{
  if(u){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); await cargarTodos(); }
  else { $('app').classList.add('hidden'); $('savebar').classList.add('hidden'); $('login').classList.remove('hidden'); }
});
async function token(){ const u=fbAuth.currentUser; if(!u) throw new Error('Sesión no iniciada'); return await u.getIdToken(); }

async function cargarTodos(){
  $('app-err').textContent='';
  try{
    const t=await token();
    const res=await fetch(API_ASIS+'?action=todos&idToken='+encodeURIComponent(t));
    const data=await res.json();
    if(data.error){ $('app-err').textContent='No se pudo cargar la lista: '+data.error; return; }
    TODOS=data.jugadores||[];
    if(!TODOS.length) $('app-err').textContent='La lista de jugadores llegó vacía. ¿Re-desplegaste el backend?';
  }catch(e){ $('app-err').textContent='Error cargando jugadores: '+(e.message||e); }
}

/* Autocompletar */
const search=$('search');
search.addEventListener('input', ()=>{
  const q=search.value.trim().toLowerCase();
  const list=$('ac-list');
  if(q.length<2){ list.classList.add('hidden'); list.innerHTML=''; return; }
  const norm=s=>String(s||'').toLowerCase().replace(/[.\-\s]/g,'');
  const res=TODOS.filter(p=>(p.nombre||'').toLowerCase().includes(q)||norm(p.rut).includes(norm(q))).slice(0,20);
  if(!res.length){ list.innerHTML='<div class="ac-item"><div class="m">Sin resultados</div></div>'; list.classList.remove('hidden'); return; }
  list.innerHTML=res.map(p=>'<div class="ac-item" data-i="'+TODOS.indexOf(p)+'"><div class="n">'+esc(p.nombre)+'</div><div class="m">'+esc(p.rut||'')+' · '+esc(p.sede||'')+' · '+esc(p.categoria||'')+'</div></div>').join('');
  list.classList.remove('hidden');
  list.querySelectorAll('.ac-item').forEach(it=>{ if(it.dataset.i!==undefined) it.onclick=()=>elegir(TODOS[+it.dataset.i]); });
});
document.addEventListener('click', e=>{ if(!e.target.closest('.ac-wrap')) $('ac-list').classList.add('hidden'); });
$('btn-buscar').onclick=()=>{
  const q=search.value.trim().toLowerCase();
  if(!q) return;
  const norm=s=>String(s||'').toLowerCase().replace(/[.\-\s]/g,'');
  const m=TODOS.find(p=>(p.nombre||'').toLowerCase()===q||norm(p.rut)===norm(q)) || TODOS.find(p=>(p.nombre||'').toLowerCase().includes(q)||norm(p.rut).includes(norm(q)));
  if(m) elegir(m); else $('app-err').textContent='No encontré ese jugador.';
};
search.addEventListener('keydown',e=>{ if(e.key==='Enter'){ $('ac-list').classList.add('hidden'); $('btn-buscar').click(); } });

async function elegir(p){
  SEL=p; search.value=p.nombre; $('ac-list').classList.add('hidden'); $('app-err').textContent='';
  $('result').innerHTML='<div class="loader">Cargando partidos...</div>';
  try{
    const t=await token();
    const res=await fetch(API_ASIS+'?action=partidos&rut='+encodeURIComponent(p.rut)+'&idToken='+encodeURIComponent(t));
    const data=await res.json();
    if(data.error){ $('result').innerHTML='<div class="loader">'+esc(data.error)+'</div>'; $('savebar').classList.add('hidden'); return; }
    PARTIDOS=data.partidos||[];
    render();
  }catch(e){ $('result').innerHTML='<div class="loader">No se pudieron cargar los partidos.</div>'; }
}

function badge(estado){
  const v=String(estado||'').toUpperCase();
  if(v.includes('TITULAR')) return '<span class="badge b-titular">⬤ Titular</span>';
  if(v.includes('INGRES')) return '<span class="badge b-ingreso">⬤ Ingresó</span>';
  if(v.includes('SUPLENTE')) return '<span class="badge b-suplente">⬤ Suplente</span>';
  return v?'<span class="badge b-otro">'+esc(estado)+'</span>':'';
}
function fdate(f){ return String(f||'').replace(/-/g,' - '); }

function render(){
  if(!PARTIDOS.length){
    $('result').innerHTML='<div class="card" style="text-align:center;color:var(--muted)">'+esc(SEL.nombre)+' no tiene partidos registrados.</div>';
    $('savebar').classList.add('hidden'); return;
  }
  let tMin=0,tGol=0,tAma=0;
  PARTIDOS.forEach(p=>{ tMin+=+p.minutos||0; tGol+=+p.goles||0; tAma+=+p.tarjAma||0; });
  let h='<div class="stats">'+
    '<div class="stat"><div class="v" style="color:var(--pink)">'+PARTIDOS.length+'</div><div class="l">Partidos</div></div>'+
    '<div class="stat"><div class="v" style="color:var(--pink)">'+tMin+'min</div><div class="l">Minutos</div></div>'+
    '<div class="stat"><div class="v" style="color:var(--ok)">'+tGol+'</div><div class="l">Goles</div></div>'+
    '<div class="stat"><div class="v" style="color:var(--warn)">'+tAma+'</div><div class="l">T. Amarillas</div></div>'+
    '</div>';
  PARTIDOS.forEach(p=>{
    h+='<div class="match"><div class="top"><div>'+
       '<div class="date">'+esc(fdate(p.fecha))+'</div>'+
       '<div class="vs">vs '+esc(p.rival||'—')+'</div>'+
       '<div class="team">'+esc(p.equipo||'')+'</div></div>'+
       badge(p.estado)+'</div>'+
       '<div class="mg">'+
       '<div class="mc"><div class="v">'+(+p.minutos||0)+'min</div><div class="l">Minutos</div></div>'+
       '<div class="mc"><div class="v" style="color:var(--ok)">'+(+p.goles||0)+'</div><div class="l">Goles</div></div>'+
       '<div class="mc"><div class="l" style="margin-bottom:4px">Tarjetas</div><div class="tcard">'+
         '<span class="tt">'+(+p.tarjAma||0)+'<span class="tsq" style="background:var(--warn)"></span></span>'+
         '<span class="tt">'+(+p.tarjRoja||0)+'<span class="tsq" style="background:var(--red)"></span></span>'+
       '</div></div>'+
       '</div></div>';
  });
  $('result').innerHTML=h;
  $('savebar').classList.remove('hidden');
}

/* PDF */
$('btn-pdf').onclick=()=>{
  if(!SEL||!PARTIDOS.length){ toast('Primero busca un jugador con partidos.'); return; }
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210, M=14;
  try{ doc.addImage(IMG_LOGO,'JPEG', M, 12, 16, 18); }catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(20,20,20);
  doc.text('Detalles de Partidos', M+22, 20);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(90,90,90);
  doc.text(SEL.nombre+'  ·  RUT '+(SEL.rut||''), M+22, 27);
  let tMin=0,tGol=0,tAma=0,tRoj=0;
  PARTIDOS.forEach(p=>{ tMin+=+p.minutos||0; tGol+=+p.goles||0; tAma+=+p.tarjAma||0; tRoj+=+p.tarjRoja||0; });
  doc.setFontSize(11); doc.setTextColor(30,30,30);
  doc.text('Partidos: '+PARTIDOS.length+'    Minutos: '+tMin+'    Goles: '+tGol+'    Amarillas: '+tAma+'    Rojas: '+tRoj, M, 40);
  doc.autoTable({
    startY: 45,
    head: [['Fecha','Rival','Equipo','Estado','Min','Goles','Amar.','Rojas']],
    body: PARTIDOS.map(p=>[p.fecha, p.rival, p.equipo, p.estado, (+p.minutos||0), (+p.goles||0), (+p.tarjAma||0), (+p.tarjRoja||0)]),
    styles:{ fontSize:9, cellPadding:2.5 },
    headStyles:{ fillColor:[199,15,110], textColor:255 },
    alternateRowStyles:{ fillColor:[245,245,247] },
    margin:{ left:M, right:M }
  });
  doc.save('Detalles de Partidos - '+SEL.nombre+'.pdf');
  toast('PDF generado');
};

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
</body>
